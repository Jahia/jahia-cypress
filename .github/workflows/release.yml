name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch: null

jobs:
  publish-release:
    runs-on: ubuntu-slim
    permissions:
      contents: write # chachalog creates the GitHub Release and its tag
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Build and publish
        run: |
          yarn install
          yarn workspaces foreach -vv --all --topological-dev run build
          yarn workspaces foreach -vv --all --topological --no-private npm publish --access public --tolerate-republish --provenance
      - id: chachalog
        run: npx chachalog@^0.5.3 publish-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
